name: Update Borealis snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate.py
      - htmlout.py
      - .github/workflows/update.yml

permissions:
  contents: write
  pages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate live report
        run: python3 generate.py
      - name: Commit snapshot
        run: |
          git config user.name "dustycompiler"
          git config user.email "dustycompiler@users.noreply.github.com"
          git add out docs data/history.jsonl
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh Borealis snapshot"
          git push
